# Teil 2 von 2 — gehoert IN den server-Block der Manager-Site (HTTPS).
# Forge: /etc/nginx/forge-conf/<site-id>/server/eurooffice.conf
# (wird von forge-conf/<site-id>/site.conf per "include forge-conf/<site-id>/server/*;" geladen).
#
# Der Document Server laeuft nur auf 127.0.0.1:8099. Der Browser erreicht ihn unter
# <APP_URL>/eurooffice/ — keine eigene Domain, kein zweites Zertifikat.
#
# X-Forwarded-Prefix ist Pflicht: Der Document Server baut die Adressen, die er dem
# Browser zurueckgibt (Cache, Editor.bin), aus der ANFRAGE. Ohne Praefix laedt der
# Editor und meldet dann "Herunterladen ist fehlgeschlagen" (AI Brain Learning #4031).

# ^~ ist Pflicht: sonst gewinnen die Regex-Locations der Site (\.php$, versteckte Dateien).
location ^~ /eurooffice/ {
    # Verwaltungs- und Beispielseiten des Document Servers nicht nach aussen.
    location ~ ^/eurooffice/(info|admin|example)(/|$) {
        return 404;
    }

    proxy_pass http://127.0.0.1:8099/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $eurooffice_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /eurooffice;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    client_max_body_size 100m;
}
