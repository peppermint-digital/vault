# Teil 1 von 2 — gehoert in den http-Kontext, VOR den server-Block der Site.
# Forge: /etc/nginx/forge-conf/<site-id>/before/eurooffice-map.conf
# (wird von sites-available/<domain> per "include forge-conf/<site-id>/before/*;" geladen
#  und von Forge nicht ueberschrieben).
map $http_upgrade $eurooffice_connection_upgrade {
    default upgrade;
    ''      close;
}
